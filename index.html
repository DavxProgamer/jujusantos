<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pagamento Pix</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="card">

<div class="avatar">
<img src="eu.jpg">
</div>

<h2>Pagamento</h2>
<p class="sub">Escolha o valor</p>

<input type="number" id="valor" placeholder="Digite o valor" step="0.01">

<button onclick="pagar()" class="btn">
Pagar
</button>

<div id="loading" class="loader"></div>

<div id="pagamento" class="pagamento">

<img id="qrcode">

<input id="pixCode" readonly>

<button onclick="copiarPix()" class="btn copiar">
Copiar Pix
</button>

<div id="detalhes"></div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
